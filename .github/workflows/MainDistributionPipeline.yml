# Build and test release artifacts through DuckDB's official extension pipeline.
name: Main Extension Distribution Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: data360
      vcpkg_commit: 94a541197763a4f449a1b91478df48c0584a6256
      exclude_archs: 'linux_arm64;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      reduced_ci_mode: disabled
