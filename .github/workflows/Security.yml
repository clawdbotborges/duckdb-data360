name: Security gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prohibited-runtime-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject process and executable credential dependencies
        shell: python
        run: |
          import pathlib, re, sys
          patterns = [
              r"std::system\s*\(", r"(^|[^A-Za-z0-9_])popen\s*\(",
              r"(^|[^A-Za-z0-9_])_popen\s*\(", r"CreateProcess(?:A|W)?\s*\(",
              r"ShellExecute(?:A|W)?\s*\(", r"posix_spawn(?:p)?\s*\(",
              r"(^|[^A-Za-z0-9_])fork\s*\(", r"/usr/bin/python3",
              r"/usr/bin/curl", r"SOWVI_DATA360_BROKER_PATH", r"<spawn\.h>",
              r"<sys/wait\.h>",
          ]
          failures = []
          for path in pathlib.Path("src").rglob("*"):
              if path.suffix not in {".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp"}:
                  continue
              for number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  if any(re.search(pattern, line) for pattern in patterns):
                      failures.append(f"{path}:{number}: prohibited process/executable dependency")
          if failures:
              print("\n".join(sorted(set(failures))))
              sys.exit(1)

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan complete repository history with redacted output
        shell: bash
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1
